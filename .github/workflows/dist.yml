name: dist

# Every push to main runs the release gate, builds the plugin tree and calls
# the full ci workflow; nothing is published by it. A release, a commit that
# scripts/release-gate.sh accepts, publishes in a separate job, and only after
# the whole ci workflow has passed on that commit: the dist build as a single
# orphan commit, tagged v<version>, the GitHub release of that tag, and then
# the dist branch, which the marketplace manifest on main points at, moved to
# that commit last. Publishing is serialized and never cancelled once started.
# Rerunning a failed release run finishes what is missing and moves no tag.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    outputs:
      release: ${{ steps.gate.outputs.release }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_seq is the commit count, so the history must be complete
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Release gate
        id: gate
        run: |
          set -eu
          sh scripts/release-gate.sh "$GITHUB_SHA" >"$RUNNER_TEMP/gate"
          cat "$RUNNER_TEMP/gate"
          cat "$RUNNER_TEMP/gate" >>"$GITHUB_OUTPUT"
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run ./tools/piiscan --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"

  # The tests live in ci.yml alone; the publish job waits for them.
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [check, ci]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One release at a time, none cancelled. GitHub keeps one waiting run per
    # group, so a third queued release replaces the second; rerun the dropped one.
    concurrency:
      group: dist-publish
      cancel-in-progress: false
    env:
      CGO_ENABLED: "0"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_seq, the notes and the dist ancestry check need the history
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run ./tools/piiscan --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"
      - name: Publish
        run: sh scripts/publish-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/dist"
